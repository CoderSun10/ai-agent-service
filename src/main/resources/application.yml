server:
  port: 8081
  tomcat:
    threads:
      max: 200
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: ai-agent-service
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true   # Java 21 虚拟线程
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # 主数据源：MySQL（业务数据）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/agent_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      pool-name: AgentHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000

# 第二数据源：pgvector（向量存储），手动构建，见 LangChain4jConfig
pgvector:
  url: jdbc:postgresql://${PG_HOST:localhost}:5432/agent_vector
  username: ${PG_USER:postgres}
  password: ${PG_PASSWORD:123456}
  driver-class-name: org.postgresql.Driver

# LangChain4j（DeepSeek 兼容 OpenAI 协议）
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY}
      model-name: gpt-4o-mini
      temperature: 0.7
      max-tokens: 2048
      log-requests: true
      log-responses: false
    streaming-chat-model:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY}
      model-name: gpt-4o-mini
      temperature: 0.7
      max-tokens: 2048
    embedding-model:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY}
      model-name: text-embedding-3-small
      log-requests: true
      log-responses: false

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/xml/*.xml
  type-aliases-package: com.agent.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 业务自定义配置
agent:
  embedding:
    # OpenAI text-embedding-3-small，1536 维
    dimension: 1536
  rag:
    top-k: 5
    chunk-size: 500
    chunk-overlap: 50
  memory:
    max-history: 20
    max-tokens: 3000
  escalation:
    confidence-threshold: 0.6

logging:
  level:
    com.agent: debug
    dev.langchain4j: info
