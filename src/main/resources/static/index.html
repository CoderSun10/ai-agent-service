<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · AI 多 Agent 智能客服</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --accent: #5b6cff; --accent2: #9b5cff; --text: #1e2330; --muted: #8a90a6;
            --line: #e8ecf4; --danger: #f0506e;
        }
        body {
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #eef0fb;
            background-image:
                radial-gradient(1200px 600px at 10% 0%, rgba(91,108,255,.18), transparent 60%),
                radial-gradient(1000px 600px at 100% 100%, rgba(155,92,255,.18), transparent 55%);
            overflow: hidden; position: relative;
        }
        /* 漂浮光斑 */
        .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .5;
            animation: float 14s ease-in-out infinite; }
        .blob.a { width: 360px; height: 360px; background: #7c8bff; top: -80px; left: -60px; }
        .blob.b { width: 420px; height: 420px; background: #c08bff; bottom: -120px; right: -80px;
            animation-delay: -5s; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(34px)} }

        .card {
            position: relative; width: 400px; max-width: 92vw; padding: 42px 40px 34px;
            background: rgba(255,255,255,.78); backdrop-filter: blur(22px) saturate(160%);
            border: 1px solid rgba(255,255,255,.6); border-radius: 24px;
            box-shadow: 0 30px 70px rgba(60,70,140,.22); animation: rise .6s cubic-bezier(.2,.8,.2,1);
        }
        @keyframes rise { from{opacity:0; transform:translateY(24px)} to{opacity:1; transform:none} }
        .logo { width: 60px; height: 60px; border-radius: 18px; margin: 0 auto 18px;
            display: grid; place-items: center; font-size: 30px; color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 10px 24px rgba(91,108,255,.45); }
        h1 { text-align: center; font-size: 21px; font-weight: 700; color: var(--text); }
        .sub { text-align: center; color: var(--muted); font-size: 13px; margin: 7px 0 28px; }

        .field { position: relative; margin-bottom: 16px; }
        .field svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            width: 18px; height: 18px; stroke: var(--muted); }
        .field input {
            width: 100%; padding: 14px 14px 14px 44px; font-size: 14.5px; color: var(--text);
            background: #fff; border: 1.5px solid var(--line); border-radius: 13px; outline: none;
            transition: .18s; font-family: inherit;
        }
        .field input:focus { border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(91,108,255,.14); }

        .btn {
            width: 100%; margin-top: 6px; padding: 14px; font-size: 15px; font-weight: 700;
            color: #fff; border: none; border-radius: 13px; cursor: pointer; font-family: inherit;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 12px 26px rgba(91,108,255,.4); transition: .18s; letter-spacing: 2px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 30px rgba(91,108,255,.5); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
        .btn .spinner { display: none; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.5);
            border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
            vertical-align: -3px; margin-right: 8px; }
        .btn.loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hint { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 20px; }
        .hint b { color: var(--accent); }
        .tags { display: flex; gap: 7px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
        .tags span { font-size: 11px; color: var(--muted); background: rgba(91,108,255,.08);
            padding: 4px 10px; border-radius: 99px; }

        .err { color: var(--danger); font-size: 13px; text-align: center; min-height: 18px;
            margin-top: 4px; opacity: 0; transition: .2s; }
        .err.show { opacity: 1; }
    </style>
</head>
<body>
<div class="blob a"></div>
<div class="blob b"></div>

<div class="card">
    <div class="logo">🤖</div>
    <h1>AI 多 Agent 智能客服</h1>
    <p class="sub">DeepSeek/GPT · RAG · Tool Calling · 流式对话</p>

    <form onsubmit="event.preventDefault(); login();">
        <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="username" placeholder="用户名" value="demo" autocomplete="username">
        </div>
        <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="password" type="password" placeholder="密码" value="123456" autocomplete="current-password">
        </div>
        <div class="err" id="err"></div>
        <button class="btn" id="loginBtn" type="submit">
            <span class="spinner"></span><span class="txt">登 录</span>
        </button>
    </form>

    <p class="hint">演示账号：<b>demo</b> / <b>123456</b>（admin · agent01 · alice 同密码）</p>
    <div class="tags">
        <span>多轮对话</span><span>RAG 知识库</span><span>工具调用</span><span>转人工</span>
    </div>
</div>

<script>
    // 已登录则直接进应用
    if (localStorage.getItem('agent_token')) location.replace('chat.html');

    function showErr(msg) {
        const e = document.getElementById('err');
        e.textContent = msg; e.classList.add('show');
    }

    async function login() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        document.getElementById('err').classList.remove('show');
        if (!username || !password) { showErr('请输入用户名和密码'); return; }

        btn.classList.add('loading'); btn.disabled = true;
        btn.querySelector('.txt').textContent = '登录中';
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();
            if (data.code !== 200) { showErr(data.message || '登录失败'); return; }
            localStorage.setItem('agent_token', data.data.token);
            localStorage.setItem('agent_user', JSON.stringify(data.data));
            // 渐隐过渡后跳转
            document.querySelector('.card').style.transition = '.4s';
            document.querySelector('.card').style.opacity = '0';
            document.querySelector('.card').style.transform = 'translateY(-16px) scale(.98)';
            setTimeout(() => location.href = 'chat.html', 380);
        } catch (e) {
            showErr('无法连接服务，请确认后端已启动');
        } finally {
            if (!localStorage.getItem('agent_token')) {
                btn.classList.remove('loading'); btn.disabled = false;
                btn.querySelector('.txt').textContent = '登 录';
            }
        }
    }
</script>
</body>
</html>
