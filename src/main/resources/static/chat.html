<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 多 Agent 智能客服</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f4f6fc; --panel: #ffffff; --soft: #f2f4fb;
            --accent: #5b6cff; --accent2: #9b5cff;
            --text: #1e2330; --muted: #8a90a6; --line: #e9edf6;
            --ok: #18b56a; --danger: #f0506e;
            --shadow: 0 8px 30px rgba(60,70,140,.10);
        }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg); color: var(--text); display: flex; flex-direction: column;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #d7dcec; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #c2c9e0; }

        /* 顶栏 */
        header {
            height: 62px; flex-shrink: 0; padding: 0 24px; background: var(--panel);
            border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 13px;
            box-shadow: 0 1px 10px rgba(60,70,140,.04); z-index: 5;
        }
        .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; font-size: 16px; }
        .brand .ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center;
            font-size: 19px; color: #fff; background: linear-gradient(135deg,var(--accent),var(--accent2));
            box-shadow: 0 6px 16px rgba(91,108,255,.4); }
        .brand span { background: linear-gradient(90deg,var(--accent),var(--accent2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .pill { margin-left: 14px; font-size: 12px; color: var(--accent);
            background: #eef0ff; padding: 5px 13px; border-radius: 99px; font-weight: 600; }
        .me { margin-left: auto; display: flex; align-items: center; gap: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
            color: #fff; font-weight: 700; font-size: 14px;
            background: linear-gradient(135deg,#ff9a62,#ff5c8a); }
        .me .info { line-height: 1.25; }
        .me .info b { font-size: 13.5px; } .me .info small { color: var(--muted); font-size: 11.5px; }
        .icon-btn { width: 36px; height: 36px; border: 1px solid var(--line); background: var(--panel);
            border-radius: 10px; cursor: pointer; display: grid; place-items: center; transition: .15s; }
        .icon-btn:hover { border-color: var(--danger); background: #fdecef; }
        .icon-btn svg { width: 17px; height: 17px; stroke: var(--muted); }
        .icon-btn:hover svg { stroke: var(--danger); }

        .wrap { flex: 1; display: flex; min-height: 0; }

        /* 侧栏 */
        aside { width: 270px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line);
            padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        aside h2 { font-size: 11px; color: var(--muted); text-transform: uppercase;
            letter-spacing: .7px; font-weight: 700; margin-bottom: 10px; }
        .conv-card { background: linear-gradient(135deg,#eef0ff,#f6f0ff); border: 1px solid #e6e8ff;
            border-radius: 14px; padding: 14px; }
        .conv-card .row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
        .conv-card .row span { color: var(--muted); }
        .quick { display: flex; flex-direction: column; gap: 9px; }
        .quick button { display: flex; align-items: center; gap: 9px; background: var(--soft);
            color: var(--text); text-align: left; font: inherit; font-size: 13px; cursor: pointer;
            border: 1px solid transparent; border-radius: 11px; padding: 11px 12px; transition: .15s; }
        .quick button:hover { border-color: var(--accent); background: #eef0ff; transform: translateX(2px); }
        .quick button .e { font-size: 16px; }
        .new-btn { display: flex; align-items: center; justify-content: center; gap: 7px;
            border: 1.5px dashed #c9cfe6; background: transparent; color: var(--accent); font: inherit;
            font-weight: 600; border-radius: 11px; padding: 11px; cursor: pointer; transition: .15s; }
        .new-btn:hover { background: #eef0ff; border-style: solid; }

        /* 主区 */
        main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .events { flex-shrink: 0; padding: 0 26px; height: 0; overflow: hidden; opacity: 0;
            display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
            border-bottom: 1px solid transparent; background: var(--panel); transition: .25s; }
        .events.on { height: auto; min-height: 48px; opacity: 1; padding: 11px 26px;
            border-bottom-color: var(--line); }
        .events .lbl { color: var(--muted); font-size: 12px; }
        .tag { font-size: 12px; padding: 4px 12px; border-radius: 99px; font-weight: 600;
            animation: pop .25s ease; }
        @keyframes pop { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
        .tag-intent { background: #eef0ff; color: var(--accent); }
        .tag-escalate { background: #fdecef; color: var(--danger); }
        .tag-done { background: #eafaf1; color: var(--ok); }

        .chat { flex: 1; overflow-y: auto; padding: 28px 26px; }
        .chat-inner { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
        .turn { display: flex; gap: 13px; align-items: flex-start; animation: fadein .35s ease; }
        @keyframes fadein { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
        .turn.user { flex-direction: row-reverse; }
        .turn .av { width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0; display: grid;
            place-items: center; font-size: 18px; color: #fff; }
        .turn.bot .av { background: linear-gradient(135deg,var(--accent),var(--accent2)); }
        .turn.user .av { background: linear-gradient(135deg,#ff9a62,#ff5c8a); font-weight: 700; font-size: 14px; }
        .bubble { max-width: 72%; padding: 13px 17px; border-radius: 15px; line-height: 1.7;
            white-space: pre-wrap; word-break: break-word; font-size: 14.5px; box-shadow: var(--shadow); }
        .turn.bot .bubble { background: var(--panel); border: 1px solid var(--line);
            border-top-left-radius: 5px; }
        .turn.user .bubble { background: linear-gradient(135deg,var(--accent),var(--accent2));
            color: #fff; border-top-right-radius: 5px; }
        .cursor { display: inline-block; width: 7px; height: 16px; border-radius: 1px; margin-left: 1px;
            background: var(--accent); animation: blink 1s steps(2) infinite; vertical-align: -2px; }
        @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }

        /* 正在思考 */
        .thinking { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13.5px; }
        .dots { display: inline-flex; gap: 5px; }
        .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
            animation: bounce 1.3s infinite ease-in-out both; }
        .dots i:nth-child(1){ animation-delay: -.32s; }
        .dots i:nth-child(2){ animation-delay: -.16s; }
        @keyframes bounce { 0%,80%,100%{transform:scale(.5);opacity:.4} 40%{transform:scale(1);opacity:1} }

        .welcome { text-align: center; margin: auto; color: var(--muted); padding-top: 8vh; }
        .welcome .big { font-size: 54px; margin-bottom: 14px; }
        .welcome h3 { color: var(--text); font-size: 20px; margin-bottom: 8px; }
        .welcome p { font-size: 14px; line-height: 1.9; }

        /* 输入区 */
        .composer { flex-shrink: 0; padding: 16px 26px 22px; background: linear-gradient(180deg,transparent,var(--bg) 30%); }
        .composer .box { max-width: 880px; margin: 0 auto; display: flex; gap: 11px; align-items: flex-end;
            background: var(--panel); border: 1.5px solid var(--line); border-radius: 16px;
            padding: 8px 8px 8px 18px; box-shadow: var(--shadow); transition: .15s; }
        .composer .box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(91,108,255,.12); }
        .composer textarea { flex: 1; border: none; outline: none; resize: none; font: inherit;
            font-size: 14.5px; line-height: 1.5; color: var(--text); background: transparent;
            max-height: 120px; padding: 9px 0; }
        .send { width: 42px; height: 42px; flex-shrink: 0; border: none; border-radius: 12px; cursor: pointer;
            display: grid; place-items: center; transition: .15s;
            background: linear-gradient(135deg,var(--accent),var(--accent2));
            box-shadow: 0 6px 16px rgba(91,108,255,.4); }
        .send:hover { transform: translateY(-1px); }
        .send:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
        .send svg { width: 19px; height: 19px; stroke: #fff; fill: none; }
        .hint-line { max-width: 880px; margin: 9px auto 0; font-size: 11.5px; color: var(--muted); text-align: center; }

        .toast { position: fixed; top: 76px; left: 50%; transform: translateX(-50%);
            background: #2b3242; color: #fff; padding: 11px 22px; border-radius: 11px; font-size: 14px;
            opacity: 0; transition: .3s; pointer-events: none; box-shadow: var(--shadow); z-index: 20; }
        .toast.show { opacity: 1; } .toast.err { background: var(--danger); }

        /* 知识库弹窗 */
        .mask { position: fixed; inset: 0; background: rgba(30,35,48,.45); backdrop-filter: blur(3px);
            display: none; align-items: center; justify-content: center; z-index: 30; }
        .mask.on { display: flex; animation: fadein .2s; }
        .modal { width: 520px; max-width: 92vw; max-height: 84vh; background: var(--panel);
            border-radius: 20px; box-shadow: 0 30px 70px rgba(30,40,90,.3); overflow: hidden;
            display: flex; flex-direction: column; animation: rise .3s cubic-bezier(.2,.8,.2,1); }
        @keyframes rise { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
        .modal-head { padding: 20px 24px; border-bottom: 1px solid var(--line);
            display: flex; align-items: center; gap: 10px; }
        .modal-head h3 { font-size: 17px; } .modal-head .x { margin-left: auto; cursor: pointer;
            color: var(--muted); font-size: 22px; line-height: 1; background: none; border: none; }
        .modal-body { padding: 22px 24px; overflow-y: auto; }
        .drop { border: 2px dashed #cdd3e8; border-radius: 14px; padding: 26px; text-align: center;
            cursor: pointer; transition: .15s; color: var(--muted); }
        .drop:hover, .drop.hover { border-color: var(--accent); background: #f6f7ff; color: var(--accent); }
        .drop .em { font-size: 32px; } .drop b { color: var(--text); }
        .drop small { display: block; margin-top: 6px; font-size: 12px; }
        .kb-title { width: 100%; margin-top: 14px; padding: 11px 14px; font: inherit; font-size: 14px;
            border: 1.5px solid var(--line); border-radius: 11px; outline: none; }
        .kb-title:focus { border-color: var(--accent); }
        .up-btn { width: 100%; margin-top: 12px; padding: 12px; font: inherit; font-weight: 700;
            color: #fff; border: none; border-radius: 12px; cursor: pointer;
            background: linear-gradient(135deg,var(--accent),var(--accent2)); }
        .up-btn:disabled { opacity: .5; cursor: not-allowed; }
        .doc-list { margin-top: 22px; }
        .doc-list h4 { font-size: 12px; color: var(--muted); text-transform: uppercase;
            letter-spacing: .6px; margin-bottom: 10px; }
        .doc { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 11px;
            background: var(--soft); margin-bottom: 8px; font-size: 13.5px; cursor: pointer; transition: .15s; }
        .doc:hover { background: #eef0ff; }
        .doc .ft { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
            background: #e7eaff; color: var(--accent); font-size: 11px; font-weight: 700; flex-shrink: 0; }
        .doc .nm { flex: 1; } .doc .ck { color: var(--ok); font-size: 12px; }
        .empty-doc { color: var(--muted); font-size: 13px; }
        .chunks { display: none; }
        .chunks.on { display: block; margin: -3px 0 12px; padding-left: 6px; }
        .chunk { display: flex; gap: 8px; padding: 9px 11px; background: #fff; border: 1px solid var(--line);
            border-radius: 9px; margin-bottom: 6px; font-size: 12.5px; line-height: 1.65; }
        .chunk .ci { color: var(--accent); font-weight: 700; flex-shrink: 0; }
        .chunk .ct { color: #444; white-space: pre-wrap; word-break: break-word; }
        .chunk-tip { color: var(--muted); font-size: 12.5px; padding: 4px 6px; }
    </style>
</head>
<body>
<header>
    <div class="brand"><div class="ic">🤖</div>AI 多 Agent <span>智能客服</span></div>
    <span class="pill">GPT-4o-mini · RAG · Tool Calling · SSE</span>
    <div class="me">
        <div class="info" style="text-align:right">
            <b id="hName">-</b><br><small id="hRole">-</small>
        </div>
        <div class="avatar" id="hAvatar">U</div>
        <button class="icon-btn" title="退出登录" onclick="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
    </div>
</header>

<div class="wrap">
    <aside>
        <div>
            <h2>当前会话</h2>
            <div class="conv-card">
                <div class="row"><span>会话 ID</span><b id="convId">-</b></div>
                <div class="row"><span>状态</span><b style="color:var(--ok)">进行中</b></div>
            </div>
        </div>
        <div>
            <h2>快捷测试</h2>
            <div class="quick">
                <button onclick="quick('帮我查一下订单 O20260601001 的状态')"><span class="e">📦</span>查订单（Tool）</button>
                <button onclick="quick('O20260601001 物流到哪了')"><span class="e">🚚</span>查物流（Tool）</button>
                <button onclick="quick('订单 O20260601002 我要退款，质量问题')"><span class="e">💸</span>申请退款（Tool）</button>
                <button onclick="quick('帮我推荐一款适合编程的键盘')"><span class="e">💬</span>闲聊（Chat）</button>
                <button onclick="quick('你们的退货政策是什么？')"><span class="e">📚</span>知识库问答（RAG）</button>
            </div>
        </div>
        <button class="new-btn" onclick="newConv(true)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            新建会话
        </button>
        <button class="new-btn" onclick="openKb()" style="border-color:#cdbff0;color:var(--accent2)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            知识库管理
        </button>
    </aside>

    <main>
        <div class="events" id="events"><span class="lbl">SSE 事件流：</span></div>
        <div class="chat" id="chat">
            <div class="chat-inner" id="chatInner">
                <div class="welcome" id="welcome">
                    <div class="big">💬</div>
                    <h3>你好，我是智能客服助手</h3>
                    <p>点击左侧「快捷测试」，或直接输入问题<br>
                       观察意图识别 · 流式打字 · 工具调用 · 转人工兜底</p>
                </div>
            </div>
        </div>
        <div class="composer">
            <div class="box">
                <textarea id="msgInput" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行…"
                          oninput="autoGrow(this)" onkeydown="onKey(event)"></textarea>
                <button class="send" id="sendBtn" onclick="send()">
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
            <div class="hint-line">AI 回复由大模型生成，订单/物流为演示数据</div>
        </div>
    </main>
</div>

<!-- 知识库管理弹窗 -->
<div class="mask" id="kbMask" onclick="if(event.target===this)closeKb()">
    <div class="modal">
        <div class="modal-head">
            <h3>📚 知识库管理</h3>
            <button class="x" onclick="closeKb()">&times;</button>
        </div>
        <div class="modal-body">
            <label class="drop" id="drop">
                <input type="file" id="fileInput" accept=".pdf,.txt,.md,.markdown" hidden onchange="onPick()">
                <div class="em">📄</div>
                <b id="dropText">点击选择文档</b>
                <small>支持 PDF / TXT / Markdown，上传后自动向量化入库</small>
            </label>
            <input class="kb-title" id="kbTitle" placeholder="文档标题（可选，留空取文件名）">
            <button class="up-btn" id="upBtn" onclick="uploadDoc()" disabled>上传并建立索引</button>

            <div class="doc-list">
                <h4>已索引文档</h4>
                <div id="docList"><div class="empty-doc">加载中…</div></div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const token = localStorage.getItem('agent_token');
    const user = JSON.parse(localStorage.getItem('agent_user') || 'null');
    if (!token || !user) location.replace('index.html');

    let conversationId = null, streaming = false;

    // 顶栏用户信息
    document.getElementById('hName').textContent = user.username;
    document.getElementById('hRole').textContent = '角色：' + user.role;
    document.getElementById('hAvatar').textContent = user.username.slice(0, 1).toUpperCase();

    function toast(msg, isErr) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
        setTimeout(() => t.className = 'toast', 2800);
    }

    function logout() {
        fetch('/api/auth/logout', {method: 'POST', headers: {'Authorization': token}});
        localStorage.removeItem('agent_token');
        localStorage.removeItem('agent_user');
        location.replace('index.html');
    }

    async function newConv(clear) {
        try {
            const res = await fetch('/api/chat/conversation', {
                method: 'POST', headers: {'Authorization': token}
            });
            if (res.status === 401) { return logout(); }
            const data = await res.json();
            conversationId = data.data;
            document.getElementById('convId').textContent = conversationId.slice(0, 10) + '…';
            if (clear) {
                document.getElementById('chatInner').innerHTML = '';
                clearEvents();
                toast('已新建会话');
            }
        } catch (e) { toast('无法连接服务', true); }
    }

    function autoGrow(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }
    function onKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    }
    function quick(text) {
        const input = document.getElementById('msgInput');
        input.value = text; autoGrow(input); send();
    }

    function clearEvents() {
        const e = document.getElementById('events');
        e.innerHTML = '<span class="lbl">SSE 事件流：</span>';
        e.classList.remove('on');
    }
    function addEventTag(type, text) {
        const e = document.getElementById('events');
        e.classList.add('on');
        const tag = document.createElement('span');
        tag.className = 'tag tag-' + type; tag.textContent = text;
        e.appendChild(tag);
    }

    function addTurn(role, text) {
        const w = document.getElementById('welcome'); if (w) w.remove();
        const turn = document.createElement('div');
        turn.className = 'turn ' + role;
        const av = document.createElement('div');
        av.className = 'av';
        av.textContent = role === 'bot' ? '🤖' : user.username.slice(0,1).toUpperCase();
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (text) bubble.textContent = text;
        turn.appendChild(av); turn.appendChild(bubble);
        document.getElementById('chatInner').appendChild(turn);
        scrollBottom();
        return bubble;
    }

    function scrollBottom() {
        const c = document.getElementById('chat');
        c.scrollTop = c.scrollHeight;
    }

    function send() {
        const input = document.getElementById('msgInput');
        const message = input.value.trim();
        if (!message || streaming) return;
        if (!conversationId) { toast('会话未就绪', true); return; }

        clearEvents();
        addTurn('user', message);
        input.value = ''; autoGrow(input);
        streaming = true;
        document.getElementById('sendBtn').disabled = true;

        // 机器人气泡：先放“正在思考”
        const bubble = addTurn('bot', '');
        bubble.innerHTML = '<div class="thinking"><span class="dots"><i></i><i></i><i></i></span>正在思考…</div>';

        let answer = '', started = false, gotError = false;
        const cursor = document.createElement('span'); cursor.className = 'cursor';

        const url = '/api/chat/stream'
            + '?conversationId=' + encodeURIComponent(conversationId)
            + '&message=' + encodeURIComponent(message)
            + '&Authorization=' + encodeURIComponent(token);
        const es = new EventSource(url);

        es.addEventListener('conversation', e => { conversationId = e.data; });
        es.addEventListener('intent', e => {
            const label = {knowledge:'📚 知识库检索', tool:'🔧 工具调用', chat:'💬 闲聊'}[e.data] || e.data;
            addEventTag('intent', '意图：' + label);
        });
        es.addEventListener('message', e => {
            if (!started) { started = true; bubble.innerHTML = ''; bubble.appendChild(cursor); }
            answer += e.data;
            cursor.remove();
            bubble.textContent = answer;
            bubble.appendChild(cursor);
            scrollBottom();
        });
        es.addEventListener('escalate', e => addEventTag('escalate', '⚠ 转人工：' + e.data));
        es.addEventListener('done', e => { addEventTag('done', '✓ 完成'); cursor.remove(); finish(es); });
        es.addEventListener('error', e => {
            gotError = true;
            if (e.data) addEventTag('escalate', '错误：' + e.data);
            cursor.remove();
            if (!answer) bubble.innerHTML = '<span style="color:var(--danger)">服务异常，请查看后端日志</span>';
            finish(es);
        });
        es.onerror = () => {
            if (!streaming) return;
            cursor.remove();
            if (!answer && !gotError) bubble.innerHTML = '<span style="color:var(--muted)">连接中断或请求超时</span>';
            finish(es);
        };
    }

    function finish(es) {
        es.close();
        streaming = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('msgInput').focus();
    }

    // ============ 知识库管理 ============
    function openKb() {
        document.getElementById('kbMask').classList.add('on');
        loadDocs();
    }
    function closeKb() {
        document.getElementById('kbMask').classList.remove('on');
    }
    function onPick() {
        const f = document.getElementById('fileInput').files[0];
        const ok = !!f;
        document.getElementById('upBtn').disabled = !ok;
        document.getElementById('dropText').textContent = ok ? f.name : '点击选择文档';
        document.getElementById('drop').classList.toggle('hover', ok);
    }
    async function uploadDoc() {
        const f = document.getElementById('fileInput').files[0];
        if (!f) return;
        const btn = document.getElementById('upBtn');
        btn.disabled = true; btn.textContent = '上传中，正在向量化…';
        try {
            const fd = new FormData();
            fd.append('file', f);
            const title = document.getElementById('kbTitle').value.trim();
            if (title) fd.append('title', title);
            const res = await fetch('/api/knowledge/upload', {
                method: 'POST', headers: {'Authorization': token}, body: fd
            });
            const data = await res.json();
            if (data.code === 200) {
                toast('索引成功，文档已入库');
                document.getElementById('fileInput').value = '';
                document.getElementById('kbTitle').value = '';
                document.getElementById('dropText').textContent = '点击选择文档';
                document.getElementById('drop').classList.remove('hover');
                loadDocs();
            } else {
                toast(data.message || '上传失败', true);
            }
        } catch (e) {
            toast('上传失败：' + e.message, true);
        } finally {
            btn.disabled = false; btn.textContent = '上传并建立索引';
        }
    }
    async function loadDocs() {
        const box = document.getElementById('docList');
        try {
            const res = await fetch('/api/knowledge/list', {headers: {'Authorization': token}});
            const data = await res.json();
            const docs = data.data || [];
            if (!docs.length) { box.innerHTML = '<div class="empty-doc">暂无文档，上传一个试试</div>'; return; }
            box.innerHTML = docs.map(d => `
                <div class="doc" onclick="viewChunks(${d.id})" title="点击查看向量库中的分块内容">
                    <div class="ft">${(d.fileType || 'txt').toUpperCase().slice(0,3)}</div>
                    <div class="nm">${escapeHtml(d.title)}</div>
                    <div class="ck">${d.chunkCount > 0 ? '✓ ' + d.chunkCount + ' 块' : '—'}</div>
                </div>
                <div class="chunks" id="chunks-${d.id}"></div>`).join('');
        } catch (e) {
            box.innerHTML = '<div class="empty-doc">加载失败</div>';
        }
    }
    async function viewChunks(docId) {
        const panel = document.getElementById('chunks-' + docId);
        if (panel.classList.contains('on')) { panel.classList.remove('on'); panel.innerHTML = ''; return; }
        panel.classList.add('on');
        panel.innerHTML = '<div class="chunk-tip">加载中…</div>';
        try {
            const res = await fetch('/api/knowledge/chunks/' + docId, {headers: {'Authorization': token}});
            const data = await res.json();
            const chunks = data.data || [];
            if (!chunks.length) {
                panel.innerHTML = '<div class="chunk-tip">该文档在向量库中暂无分块（示例文档仅为元数据，未上传正文）</div>';
                return;
            }
            panel.innerHTML = '<div class="chunk-tip">↓ 向量库 kb_chunk 中实际存储的文本块（每块都已转成 1536 维向量）</div>'
                + chunks.map(c => `
                    <div class="chunk">
                        <span class="ci">#${c.chunk_index}</span>
                        <span class="ct">${escapeHtml(c.content)}</span>
                    </div>`).join('');
        } catch (e) {
            panel.innerHTML = '<div class="chunk-tip">加载失败</div>';
        }
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c =>
            ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // 进入即创建会话
    newConv(false);
</script>
</body>
</html>
